mime_config = ["conf/mime_types.toml"]
[[listeners]]
	listen = { domain = "localhost", port = 33000 }

[[listeners.server]]
	server_name = ""
	directory_listing = true
	file_upload = false
	#index = ["index.html"]
	method_map = [{ POST = [".bla", ".php", ".py"] }, { GET = [] }]
	path = "/"
	root = "/home/bl4st/github/webserv/serv_root"
	status_pages = [
		{ status = 404, target = "/home/bl4st/github/webserv/serv_root/errors/404.html" },
	]
	backends = [
		[
			"php",
			"cgi",
			[
				"/bin/php-cgi",
			],
		],
		[
			"py",
			"cgi",
			[
				"/bin/python3",
			],
		],
		[
			".bla",
			"cgi",
			[
				"/home/bl4st/github/webserv/serv_root/cgi_tester",
			],
		],
	]

[[listeners.server.location]]
	path = "/directory"
	root = "/home/bl4st/github/webserv/serv_root/YoupiBanane"
	file_upload = true
	index = ["youpi.bad_extension"]
	backends = [["php", "cgi", ["/bin/php-cgi"]]]
	directory_listing = false
	method_map = [{ GET = [] }]

[[listeners.server.location]]
	path = "/directory"
	root = "/home/bl4st/github/webserv/serv_root/YoupiBanane"
	file_upload = true
	index = ["youpi.bad_extension"]
	backends = [[".bla", "cgi", ["/home/bl4st/github/goinfre/webserv/cgi_tester"]]]
	directory_listing = false
	method_map = [{ POST = [".bla"] }]

[[listeners.server.location]]
	path = "/"
	root = "/home/bl4st/github/webserv/serv_root"
	file_upload = true
	max_resource_size = 100
	directory_listing = false
	method_map = [{ POST = ["post_body"] }]


