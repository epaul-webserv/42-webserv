
[[listeners]]
	listen = { domain = "localhost", port = 80 }

[listeners.server]
	server_name = "toto.fr" # defaults to "";
	directory_listing = false # defaults to false
	file_upload = false # defaults to false
	path = "/" # defaults to "/" must be / ended
	root = "/var/www/html/" # no default must be set
	status_pages = [
		{ status = 403, target = "/var/www/html/403.php" }, # absolute path (begins with /)
		{ status = 404, target = "/var/www/html/404.php" },
	] # can be empty
	accepted_method = ["GET", "POST"] # can be empty
	index = ["index.html", "index.php"] # can be empty
	backends = [
		[
			"php",
			"cgi",
			[
				"/bin/php-cgi",
				"-s",
				"-i",
				"-x",
				"-s",
				"-e",
				"-v",
				"-e",
				"-n",
			],
		],
		[
			"py",
			"cgi",
			[
				"/bin/python3",
				"-test",
			],
		],
	]

	redirects = [
		{ path = "/logan", target = "http://loganmartin.fr/", type = "perm" },
		{ path = "/toto", target = "http://toto.fr/", type = "temp" },
	]

[[listeners.server.location]]
	path = "test/" # defaults to "/" must be / ended
	directory_listing = true # defaults to false
	file_upload = true # defaults to false
