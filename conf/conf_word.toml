# WordPress VirtualHost Adaption
mime_config = ["conf/mime_types.toml"]
[[listeners]]
	listen = { domain = "localhost", port = 8080 }

[[listeners.server]]
	server_name = ""
	directory_listing = false
	file_upload = true
	index = ["index.php"]
	path = "/"
	# root = "/home/bl4st/github/webserv/serv_root"
	root = "/srv/www/wordpress"
	# root = "/srv/www/wordpress/pma"
	method_map = [
		{ GET = [
		] },
		{ POST = [
		] },
		{ DELETE = [
		] },
		{ OPTIONS = [
		] },
		{ PUT = [
		] },
		{ PATCH = [
		] },
	]
	# backends = [["php", "cgi", ["/usr/bin/env", "python3", "ok.py"]]]
	backends = [["php", "cgi", ["/bin/php-cgi"]]]
