<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | webserv</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ef4444; /* Red accent for errors */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 4rem 2rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .error-code {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .error-message {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .home-btn {
            display: inline-block;
            background: rgba(239, 68, 68, 0.08);
            color: var(--accent-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .home-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            transform: translateY(-1px);
        }

        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <p class="error-message">
            The requested resource could not be found on this server. <br>
            Please check the URL or return to the main gate.
        </p>

        <a href="/" class="home-btn">Return Home</a>

        <footer>
            webserv HTTP/1.1 • Error Handler
        </footer>
    </div>

</body>
</html>
