<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webserv | HTTP Server</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .contributors {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .links-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cgi-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .cgi-link:hover {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.04);
            transform: translateY(-1px);
        }

        .cgi-link .type {
            font-family: monospace;
            font-size: 0.85rem;
            background: var(--border-color);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            color: var(--text-muted);
        }

        .cgi-link:hover .type {
            background: var(--accent-color);
            color: var(--bg-color);
            font-weight: 600;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">webserv</div>
        <div class="tagline">A custom HTTP/1.1 non-blocking web server.</div>

        <div class="contributors">
            <span class="badge">tpotier</span>
            <span class="badge">lomartin</span>
            <span class="badge">pberne</span>
        </div>

        <div class="links-section">
            <a href="/index.py" class="cgi-link">
                <span>Run Python Gateway</span>
                <span class="type">index.py</span>
            </a>
            <a href="/index.php" class="cgi-link">
                <span>Run PHP Gateway</span>
                <span class="type">index.php</span>
            </a>
        </div>

        <footer>
            HTTP/1.1 • Powered by epoll
        </footer>
    </div>

</body>
</html>
